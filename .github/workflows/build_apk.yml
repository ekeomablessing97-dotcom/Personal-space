name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate modern Android v2 files while keeping custom manifest
        run: |
          mkdir -p assets/images assets/icons assets/fonts
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.backup.xml
          fi
          rm -rf android
          flutter create --platforms=android --org com.example .
          if [ -f /tmp/AndroidManifest.backup.xml ]; then
            cp /tmp/AndroidManifest.backup.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-space-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
