name: personal_space
description: A local-first personal notes, journal, ideas, tasks, voice notes, memory lane, and private space application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  record: ^5.1.2
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.1.2
  intl: ^0.19.0
  crypto: ^3.0.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
